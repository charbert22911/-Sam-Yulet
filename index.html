<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sam & Yulet</title>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;
padding:0;

height:100vh;

background:
linear-gradient(
rgba(0,0,0,0.75),
rgba(0,0,0,0.85)
),
#1b2115;

display:flex;
justify-content:center;
align-items:center;

font-family:Georgia, serif;

color:#f5ead7;

text-align:center;

}


.contenedor{

width:90%;
max-width:600px;

}


.nombre{

font-size:58px;

color:#d6b25e;

letter-spacing:3px;

margin-bottom:25px;

}


.mensaje{

font-size:22px;

line-height:1.5;

margin-bottom:35px;

color:#f5ead7;

}


.subtitulo{

font-size:24px;

color:#d6b25e;

margin-bottom:25px;

}


button{

padding:18px 45px;

margin:10px;

border:none;

border-radius:50px;

font-size:20px;

cursor:pointer;

background:#d6b25e;

color:#1b2115;

font-family:Georgia, serif;

transition:0.3s;

}


button:hover{

transform:scale(1.08);

}


.idiomas button{

background:#f5ead7;

color:#1b2115;

}


.oculto{

display:none;

}


.decoracion{

font-size:35px;

color:#d6b25e;

margin-bottom:20px;

}


</style>

</head>


<body>


<div class="contenedor">


<div id="idioma">


<div class="decoracion">
💍
</div>


<h1 class="nombre">
Sam & Juliet
</h1>


<p class="subtitulo">
Por favor, selecciona el idioma en el que deseas leer nuestra invitación.
</p>


<div class="idiomas">

<button onclick="seleccionarIdioma('es')">
🇲🇽 Español
</button>


<button onclick="seleccionarIdioma('en')">
🇺🇸 English
</button>


</div>


</div>





<div id="invitacion" class="oculto">


<div class="decoracion">
💍
</div>


<h1 class="nombre">
Sam & Juliet
</h1>


<p id="texto" class="mensaje">

</p>


<button onclick="abrirInvitacion()" >
Abrir invitación
</button>


</div>


</div>



<script>


function seleccionarIdioma(idioma){


document.getElementById("idioma").style.display="none";

document.getElementById("invitacion").style.display="block";


if(idioma=="es"){


document.getElementById("texto").innerHTML=

"Nos encantaría compartir este momento tan especial contigo.";


}


else{


document.getElementById("texto").innerHTML=

"We would love to share this special moment with you.";


}


}



function abrirInvitacion(){


alert("Bienvenido a nuestra invitación 💍");


}



</script>



</body>

</html>
